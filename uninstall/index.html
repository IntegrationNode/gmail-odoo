                input.id = 'usage-' + idx;
                var span = document.createElement('span');
                span.textContent = TEXT.usageOptions[idx];
                label.appendChild(input);
                label.appendChild(span);
                usageBox.appendChild(label);
            });
            // Solo se pregunta lo que no llega de la extensión (FR-007).
            document.getElementById('odoo-version-field').hidden = !askOdooVersion;
            document.getElementById('usage-field').hidden = !askUsage;
        }

        function setError(container, errorEl, message) {
            container.setAttribute('aria-invalid', message ? 'true' : 'false');
            errorEl.textContent = message || '';
            errorEl.hidden = !message;
        }

        function checkedReasons() {
            return Array.prototype.slice.call(form.querySelectorAll('input[name="reason"]:checked'))
                .map(function (input) { return input.value; });
        }

        /** Las obligatorias del Form: si faltan, Google rechaza el envío sin que se vea. */
        function validate() {
            var reasons = checkedReasons();
            var otherChecked = reasons.indexOf('__other_option__') !== -1;
            var otherText = document.getElementById('reason-other-text');
            var improve = document.getElementById('improve');
            var firstInvalid = null;

            setError(document.getElementById('reasons'), document.getElementById('reasons-error'),
                reasons.length === 0 ? TEXT.errReason : '');
            if (reasons.length === 0) firstInvalid = firstInvalid || document.getElementById('reason-0');

            var otherMissing = otherChecked && !otherText.value.trim();
            setError(otherText, document.getElementById('reason-other-error'),
                otherMissing ? TEXT.errOther : '');
            if (otherMissing) firstInvalid = firstInvalid || otherText;

            var improveMissing = !improve.value.trim();
            setError(improve, document.getElementById('improve-error'),
                improveMissing ? TEXT.errImprove : '');
            if (improveMissing) firstInvalid = firstInvalid || improve;

            if (firstInvalid) firstInvalid.focus();
            return !firstInvalid;
        }

        function buildBody() {
            var body = new URLSearchParams();
            var reasons = checkedReasons();
            reasons.forEach(function (value) { body.append(ENTRY.reasons, value); });
            if (reasons.indexOf('__other_option__') !== -1) {
                body.append(ENTRY.reasons + '.other_option_response', document.getElementById('reason-other-text').value.trim());
            }
            body.append(ENTRY.improve, document.getElementById('improve').value.trim());

            var odooVersion = askOdooVersion ? document.getElementById('odoo-version').value.trim() : ctx.ov;
            if (odooVersion) body.append(ENTRY.odooVersion, odooVersion);

            var usage = askUsage
                ? (form.querySelector('input[name="usage"]:checked') || {}).value
                : usageBucket();
            if (usage) body.append(ENTRY.usage, usage);

            if (ctx.v) body.append(ENTRY.version, ctx.v);
            if (ctx.p) body.append(ENTRY.plan, ctx.p);

            var internal = {
                stage: ctx.s,
                installDate: ctx.i === 'old' ? 'before 2026-03-04' : ctx.i,
                edition: ctx.oe ? EDITION[ctx.oe] : undefined,
                hosting: ctx.h,
                locale: ctx.l,
                analyticsId: ctx.a,
                build: ctx.d === '1' ? 'unpacked' : undefined
            };
            Object.keys(internal).forEach(function (k) {
                if (INTERNAL_ENTRY[k] && internal[k]) body.append(INTERNAL_ENTRY[k], internal[k]);
            });

            body.append('pageHistory', PAGE_HISTORY);
            body.append('fvv', '1');
            return body;
        }

        function reasonKeys() {
            return checkedReasons().map(function (value) {
                if (value === '__other_option__') return 'other';
                for (var i = 0; i < REASONS.length; i++) if (REASONS[i].label === value) return REASONS[i].key;
                return 'other';
            });
        }

        var sending = false;
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            if (sending || !validate()) return;
            sending = true;
            var button = document.getElementById('send');
            var status = document.getElementById('status');
            button.disabled = true;
            button.textContent = TEXT.sending;
            status.textContent = '';
            status.classList.remove('is-error');

            var submitted = { reasons: reasonKeys(), asked_odoo_version: askOdooVersion, asked_usage_time: askUsage };

            fetch(FORM_URL, { method: 'POST', mode: 'no-cors', keepalive: true, body: buildBody() })
                .then(function () {
                    // Respuesta opaca: lo que no lanza se da por enviado.
                    capture('uninstall_survey_submitted', submitted);
                    var card = form.parentNode;
                    form.remove();
                    var thanks = document.createElement('p');
                    thanks.className = 'thanks';
                    thanks.setAttribute('role', 'status');
                    thanks.textContent = TEXT.thanks;
                    card.appendChild(thanks);
                })
                .catch(function () {
                    sending = false;
                    button.disabled = false;
                    button.textContent = TEXT.send;
                    status.classList.add('is-error');
                    status.textContent = TEXT.netError;
                });
        });

        applyTexts();
        renderOptions();
        form.hidden = false;
        trackUninstall();
    })();
    </script>
</body>
</html>
