<!DOCTYPE html>
<html lang="en">
<head>
    <!--
      Encuesta de desinstalación (spec 034, mail-client-extensions).
      Escrita a mano y fuera de src/: el build de static-i18n no la toca ni la traduce.
      Sin GA4 ni Ahrefs: la página recibe el identificador anónimo del usuario.
      Contratos: specs/034-uninstall-survey-context/contracts/*.md
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Odoo Integration for Gmail — Uninstall</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../fonts/outlined.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        .nav-product { color: var(--color-text-light); font-weight: 500; }
        .uninstall-page { padding: var(--spacing-lg) 0; background: var(--color-bg); min-height: 80vh; }
        .uninstall-card {
            max-width: 640px; margin: 0 auto; background: var(--color-bg-light);
            border: 1px solid var(--color-border); border-radius: 12px; padding: 2rem;
        }
        .uninstall-card h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
        .uninstall-card .intro { color: var(--color-text-light); margin-bottom: 1.5rem; }
        .uninstall-card fieldset, .uninstall-card .field { border: 0; padding: 0; margin: 0 0 1.5rem; }
        .uninstall-card legend, .uninstall-card .field > label {
            display: block; font-weight: 600; margin-bottom: 0.5rem; padding: 0;
        }
        .uninstall-card .required { color: var(--color-danger); }
        .uninstall-card .option { display: flex; align-items: flex-start; gap: 0.5rem; margin: 0.35rem 0; font-weight: 400; }
        .uninstall-card .option input { margin-top: 0.3rem; }
        .uninstall-card textarea, .uninstall-card input[type="text"] {
            width: 100%; box-sizing: border-box; font: inherit; padding: 0.6rem 0.75rem;
            border: 1px solid var(--color-border); border-radius: 8px; background: #fff;
        }
        .uninstall-card textarea { min-height: 96px; resize: vertical; }
        .uninstall-card input[type="text"].other-text { margin-top: 0.35rem; }
        .uninstall-card [aria-invalid="true"] { border-color: var(--color-danger); }
        .uninstall-card fieldset[aria-invalid="true"] legend { color: var(--color-danger); }
        .uninstall-card .error { color: var(--color-danger); font-size: 0.9rem; margin-top: 0.35rem; }
        .uninstall-card .status { margin-top: 1rem; }
        .uninstall-card .status.is-error { color: var(--color-danger); }
        .uninstall-card .thanks { font-size: 1.1rem; }
        .uninstall-card button[disabled] { opacity: 0.6; cursor: progress; }
        @media (max-width: 600px) { .uninstall-card { padding: 1.25rem; border-radius: 0; border-left: 0; border-right: 0; } }
    </style>
</head>
<body>
    <header class="pricing-header">
        <div class="container">
            <nav class="nav">
                <a href="https://integrationnode.com/" class="logo">IntegrationNode</a>
                <span class="nav-product">Odoo Integration for Gmail</span>
            </nav>
        </div>
    </header>

    <main class="uninstall-page">
        <div class="container">
            <div class="uninstall-card">
                <h1>Sorry to see you go</h1>
                <p class="intro">A few quick questions help us make Odoo Integration for Gmail better. It takes less than a minute.</p>

                <noscript>
                    <p>JavaScript is off — <a href="https://docs.google.com/forms/d/e/1FAIpQLSfRhLcliEjGmyu1XCWht0AqP-7ykj7nONW_CVpNm6DV-SRK9Q/viewform">you can answer the survey here</a>.</p>
                </noscript>

                <form id="survey" novalidate hidden>
                    <fieldset id="reasons" aria-describedby="reasons-error">
                        <legend>Why did you uninstall? <span class="required" aria-hidden="true">*</span><span class="sr-only"> (required)</span></legend>
                        <div id="reason-options"></div>
                        <label class="option">
                            <input type="checkbox" name="reason" value="__other_option__" id="reason-other">
                            <span>Other:</span>
                        </label>
                        <input type="text" class="other-text" id="reason-other-text" aria-label="Other reason" aria-describedby="reason-other-error" maxlength="500">
                        <p class="error" id="reason-other-error" hidden></p>
                        <p class="error" id="reasons-error" hidden></p>
                    </fieldset>

                    <div class="field">
                        <label for="improve">What could we improve? <span class="required" aria-hidden="true">*</span></label>
                        <textarea id="improve" name="improve" required aria-describedby="improve-error" maxlength="2000"></textarea>
                        <p class="error" id="improve-error" hidden></p>
                    </div>

                    <div class="field" id="odoo-version-field" hidden>
                        <label for="odoo-version">What is your Odoo version?</label>
                        <input type="text" id="odoo-version" name="odoo-version" maxlength="40" placeholder="e.g. 17.0 Enterprise">
                    </div>

                    <fieldset id="usage-field" hidden>
                        <legend>How long did you use the extension?</legend>
                        <div id="usage-options"></div>
                    </fieldset>

                    <button type="submit" class="btn btn-primary" id="send">Send</button>
                    <p class="status" id="status" role="status" aria-live="polite"></p>
                </form>
            </div>
        </div>
    </main>

    <script>
    (function () {
        'use strict';

        // ---------- Contrato de la URL (contracts/uninstall-url.md) ----------
        // Los mismos patrones que gmail-extension/src/background/services/uninstall-survey/uninstall-url.ts.
        var PATTERNS = {
            v: /^\d+(\.\d+){1,3}$/,
            p: /^(free|plus)$/,
            s: /^(none|connected|logged)$/,
            ov: /^[0-9A-Za-z.~+-]{1,24}$/,
            oe: /^(e|c)$/,
            h: /^(odoo\.com|odoo\.sh|self-hosted)$/,
            l: /^(en|es|fr|de|it|nl|pt_BR)$/,
            a: /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i,
            d: /^1$/
        };

        function isValidInstallDate(value) {
            if (value === 'old') return true;
            if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            var date = new Date(value + 'T00:00:00Z');
            if (isNaN(date.getTime()) || date.toISOString().slice(0, 10) !== value) return false;
            return date.getTime() <= Date.now();
        }

        /** Solo los parámetros válidos; los desconocidos se ignoran. */
        function readContext() {
            var params = new URLSearchParams(location.hash.slice(1));
            var ctx = {};
            Object.keys(PATTERNS).forEach(function (key) {
                var value = params.get(key);
                if (value !== null && PATTERNS[key].test(value)) ctx[key] = value;
            });
            var i = params.get('i');
            if (i !== null && isValidInstallDate(i)) ctx.i = i;
            return ctx;
        }

        var ctx = readContext();

        // ---------- Google Form (contracts/form-submission.md) ----------
        var FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfRhLcliEjGmyu1XCWht0AqP-7ykj7nONW_CVpNm6DV-SRK9Q/formResponse';
        var ENTRY = {
            reasons: 'entry.1591633300',
            improve: 'entry.326955045',
            odooVersion: 'entry.539732907',
            usage: 'entry.856095737',
            version: 'entry.1696159737',
            plan: 'entry.1470649061'
        };
        // Preguntas internas de la sección 2 (las crea T015). Una a null no se envía.
        var INTERNAL_ENTRY = {
            stage: null,
            installDate: null,
            edition: null,
            hosting: null,
            locale: null,
            analyticsId: null,
            build: null
        };
        // '0,1': las preguntas internas están en la sección 2, a la que el formulario no lleva (plan A, T001).
        var PAGE_HISTORY = '0,1';

        // Textos exactos del Form: un carácter distinto rompe el envío sin aviso.
        var REASONS = [
            { key: 'bugs', label: "It doesn't work properly / has bugs" },
            { key: 'expensive', label: "It's too expensive" },
            { key: 'missing_features', label: 'Missing features I need' },
            { key: 'setup', label: 'Too difficult to set up or configure' },
            { key: 'slow', label: 'It slows down Gmail' },
            { key: 'trying', label: 'I was just trying it out' },
            { key: 'privacy', label: 'Privacy or security concerns' }
        ];
        var USAGE = ['Less than a day', 'Less than a week', '1–4 weeks', '1–3 months', 'More than 3 months'];

        function daysSinceInstall() {
            if (!ctx.i || ctx.i === 'old') return undefined;
            var install = Date.parse(ctx.i + 'T00:00:00Z');
            var now = new Date();
            var today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
            return Math.max(0, Math.floor((today - install) / 86400000));
        }

        /** Tramo de «How long» a partir de la fecha (data-model §3). */
        function usageBucket() {
            if (ctx.i === 'old') return USAGE[4];
            var days = daysSinceInstall();
            if (days === undefined) return undefined;
            if (days === 0) return USAGE[0];
            if (days <= 6) return USAGE[1];
            if (days <= 30) return USAGE[2];
            if (days <= 92) return USAGE[3];
            return USAGE[4];
        }

        var EDITION = { e: 'enterprise', c: 'community' };

        // ---------- PostHog (contracts/posthog-events.md) ----------
        var POSTHOG_URL = 'https://eu.i.posthog.com/capture/';
        var POSTHOG_KEY = 'phc_OAwR3rWOBJk9KH5PDXxG2ZXbq0ieq4j71elbZrOw66p';

        function baseProperties() {
            var props = { source: 'uninstall_page', is_unpacked: ctx.d === '1' };
            if (ctx.s) props.stage = ctx.s;
            if (ctx.v) props.extension_version = ctx.v;
            if (ctx.p) props.plan = ctx.p;
            if (ctx.ov) props.odoo_version = ctx.ov;
            if (ctx.oe) props.odoo_edition = EDITION[ctx.oe];
            if (ctx.h) props.host_pattern = ctx.h;
            var days = daysSinceInstall();
            if (days !== undefined) props.days_since_install = days;
            if (ctx.l) props.locale = ctx.l;
            return props;
        }

        /** Sin identificador no hay eventos (FR-002). Un fallo nunca afecta a la encuesta (FR-010). */
        function capture(event, extra) {
            if (!ctx.a) return;
            try {
                var properties = baseProperties();
                Object.keys(extra || {}).forEach(function (k) { properties[k] = extra[k]; });
                fetch(POSTHOG_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        api_key: POSTHOG_KEY,
                        event: event,
                        distinct_id: ctx.a,
                        properties: properties,
                        timestamp: new Date().toISOString()
                    }),
                    keepalive: true
                }).catch(function () { /* bloqueador o sin red: la encuesta sigue */ });
            } catch (e) { /* idem */ }
        }

        /** Una vez por desinstalación: recargar no repite el evento. */
        function trackUninstall() {
            if (!ctx.a) return;
            var mark = 'uninstall_tracked:' + ctx.a;
            try {
                if (sessionStorage.getItem(mark)) return;
                sessionStorage.setItem(mark, '1');
            } catch (e) { /* sin sessionStorage se manda igual */ }
            capture('extension_uninstalled');
        }

        // ---------- Formulario ----------
        var form = document.getElementById('survey');
        var askOdooVersion = !ctx.ov;
        var askUsage = !ctx.i;

        function renderOptions() {
            var reasonBox = document.getElementById('reason-options');
            REASONS.forEach(function (r, idx) {
                var label = document.createElement('label');
                label.className = 'option';
                var input = document.createElement('input');
                input.type = 'checkbox';
                input.name = 'reason';
                input.value = r.label;
                input.id = 'reason-' + idx;
                var span = document.createElement('span');
                span.textContent = r.label;
                label.appendChild(input);
                label.appendChild(span);
                reasonBox.appendChild(label);
            });
            var usageBox = document.getElementById('usage-options');
            USAGE.forEach(function (text, idx) {
                var label = document.createElement('label');
                label.className = 'option';
                var input = document.createElement('input');
                input.type = 'radio';
                input.name = 'usage';
                input.value = text;
                input.id = 'usage-' + idx;
                var span = document.createElement('span');
                span.textContent = text;
                label.appendChild(input);
                label.appendChild(span);
                usageBox.appendChild(label);
            });
            // Solo se pregunta lo que no llega de la extensión (FR-007).
            document.getElementById('odoo-version-field').hidden = !askOdooVersion;
            document.getElementById('usage-field').hidden = !askUsage;
        }

        function setError(container, errorEl, message) {
            container.setAttribute('aria-invalid', message ? 'true' : 'false');
            errorEl.textContent = message || '';
            errorEl.hidden = !message;
        }

        function checkedReasons() {
            return Array.prototype.slice.call(form.querySelectorAll('input[name="reason"]:checked'))
                .map(function (input) { return input.value; });
        }

        /** Las obligatorias del Form: si faltan, Google rechaza el envío sin que se vea. */
        function validate() {
            var reasons = checkedReasons();
            var otherChecked = reasons.indexOf('__other_option__') !== -1;
            var otherText = document.getElementById('reason-other-text');
            var improve = document.getElementById('improve');
            var firstInvalid = null;

            setError(document.getElementById('reasons'), document.getElementById('reasons-error'),
                reasons.length === 0 ? 'Please choose at least one reason.' : '');
            if (reasons.length === 0) firstInvalid = firstInvalid || document.getElementById('reason-0');

            var otherMissing = otherChecked && !otherText.value.trim();
            setError(otherText, document.getElementById('reason-other-error'),
                otherMissing ? 'Please tell us the other reason.' : '');
            if (otherMissing) firstInvalid = firstInvalid || otherText;

            var improveMissing = !improve.value.trim();
            setError(improve, document.getElementById('improve-error'),
                improveMissing ? 'Please tell us what we could improve.' : '');
            if (improveMissing) firstInvalid = firstInvalid || improve;

            if (firstInvalid) firstInvalid.focus();
            return !firstInvalid;
        }

        function buildBody() {
            var body = new URLSearchParams();
            var reasons = checkedReasons();
            reasons.forEach(function (value) { body.append(ENTRY.reasons, value); });
            if (reasons.indexOf('__other_option__') !== -1) {
                body.append(ENTRY.reasons + '.other_option_response', document.getElementById('reason-other-text').value.trim());
            }
            body.append(ENTRY.improve, document.getElementById('improve').value.trim());

            var odooVersion = askOdooVersion ? document.getElementById('odoo-version').value.trim() : ctx.ov;
            if (odooVersion) body.append(ENTRY.odooVersion, odooVersion);

            var usage = askUsage
                ? (form.querySelector('input[name="usage"]:checked') || {}).value
                : usageBucket();
            if (usage) body.append(ENTRY.usage, usage);

            if (ctx.v) body.append(ENTRY.version, ctx.v);
            if (ctx.p) body.append(ENTRY.plan, ctx.p);

            var internal = {
                stage: ctx.s,
                installDate: ctx.i === 'old' ? 'before 2026-03-04' : ctx.i,
                edition: ctx.oe ? EDITION[ctx.oe] : undefined,
                hosting: ctx.h,
                locale: ctx.l,
                analyticsId: ctx.a,
                build: ctx.d === '1' ? 'unpacked' : undefined
            };
            Object.keys(internal).forEach(function (k) {
                if (INTERNAL_ENTRY[k] && internal[k]) body.append(INTERNAL_ENTRY[k], internal[k]);
            });

            body.append('pageHistory', PAGE_HISTORY);
            body.append('fvv', '1');
            return body;
        }

        function reasonKeys() {
            return checkedReasons().map(function (value) {
                if (value === '__other_option__') return 'other';
                for (var i = 0; i < REASONS.length; i++) if (REASONS[i].label === value) return REASONS[i].key;
                return 'other';
            });
        }

        var sending = false;
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            if (sending || !validate()) return;
            sending = true;
            var button = document.getElementById('send');
            var status = document.getElementById('status');
            button.disabled = true;
            button.textContent = 'Sending…';
            status.textContent = '';
            status.classList.remove('is-error');

            var submitted = { reasons: reasonKeys(), asked_odoo_version: askOdooVersion, asked_usage_time: askUsage };

            fetch(FORM_URL, { method: 'POST', mode: 'no-cors', keepalive: true, body: buildBody() })
                .then(function () {
                    // Respuesta opaca: lo que no lanza se da por enviado.
                    capture('uninstall_survey_submitted', submitted);
                    var card = form.parentNode;
                    form.remove();
                    var thanks = document.createElement('p');
                    thanks.className = 'thanks';
                    thanks.setAttribute('role', 'status');
                    thanks.textContent = 'Thanks — your answers were sent.';
                    card.appendChild(thanks);
                })
                .catch(function () {
                    sending = false;
                    button.disabled = false;
                    button.textContent = 'Send';
                    status.classList.add('is-error');
                    status.textContent = "Couldn't send. Check your connection and try again.";
                });
        });

        renderOptions();
        form.hidden = false;
        trackUninstall();
    })();
    </script>
</body>
</html>
